name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - run: pip install -r requirements.txt

      # Run Custom Validators
      - name: Validate Navigation Coverage
        run: python scripts/validate_nav.py

      - name: Lint C++ Code Blocks
        run: python scripts/lint_cpp.py

      - name: Audit Media References
        run: python scripts/audit_media.py

      # Build site with strict mode to fail on warnings (like broken links)
      - run: mkdocs build --strict
