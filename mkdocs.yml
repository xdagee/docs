markdown_extensions:
  # Admonitions & collapsible blocks
  - admonition
  - pymdownx.details

  # Table of contents
  - toc:
      permalink: true

  # HTML in Markdown
  - md_in_html

  # Attribute lists (for buttons, annotations)
  - attr_list

  # Code highlighting (replaces deprecated codehilite)
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

  # Fenced code blocks & Mermaid support
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  # Content tabs
  - pymdownx.tabbed:
      alternate_style: true

  # Critic markup
  - pymdownx.critic

  # Task lists & emoji
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

